apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: surajsonwane1207/bharatclean:latest # Replace with actual image
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bharatclean-secrets
              key: DATABASE_URL
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: bharatclean-secrets
              key: AUTH_SECRET
        - name: AUTH_TRUST_HOST
          value: "true"
        - name: NEXTAUTH_URL
          value: "http://bharatclean-service"
---
apiVersion: v1
kind: Service
metadata:
  name: bharatclean-service
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
