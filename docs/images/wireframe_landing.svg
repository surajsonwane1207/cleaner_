<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="800" height="40" fill="#e5e7eb"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5" fill="#27c93f"/>
  <rect x="100" y="10" width="600" height="20" rx="10" fill="white"/>
  <text x="120" y="25" font-family="sans-serif" font-size="12" fill="#9ca3af">localhost:3000</text>

  <!-- Navbar -->
  <rect x="0" y="40" width="800" height="60" fill="white" stroke="#e5e7eb"/>
  <text x="40" y="78" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f46e5">BharatClean</text>
  <text x="500" y="75" font-family="sans-serif" font-size="14" fill="#4b5563">Services</text>
  <text x="580" y="75" font-family="sans-serif" font-size="14" fill="#4b5563">Pricing</text>
  <rect x="660" y="55" width="100" height="30" rx="5" fill="#4f46e5"/>
  <text x="685" y="75" font-family="sans-serif" font-size="14" fill="white">Login</text>

  <!-- Hero Section -->
  <rect x="0" y="100" width="800" height="400" fill="#f9fafb"/>
  <text x="400" y="240" font-family="sans-serif" font-size="48" font-weight="bold" fill="#111827" text-anchor="middle">Professional Cleaning</text>
  <text x="400" y="290" font-family="sans-serif" font-size="48" font-weight="bold" fill="#111827" text-anchor="middle">Services for Your Home</text>
  <text x="400" y="340" font-family="sans-serif" font-size="18" fill="#4b5563" text-anchor="middle">Trusted by thousands of customers across the country.</text>
  
  <rect x="325" y="380" width="150" height="45" rx="5" fill="#4f46e5"/>
  <text x="400" y="408" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Get Started</text>

  <!-- Service Grid Mockup -->
  <text x="400" y="560" font-family="sans-serif" font-size="32" font-weight="bold" fill="#111827" text-anchor="middle">Our Services</text>
  <rect x="100" y="600" width="180" height="150" rx="10" fill="white" stroke="#e5e7eb"/>
  <rect x="310" y="600" width="180" height="150" rx="10" fill="white" stroke="#e5e7eb"/>
  <rect x="520" y="600" width="180" height="150" rx="10" fill="white" stroke="#e5e7eb"/>
</svg>
