<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa"/>

  <!-- Client Layer -->
  <rect x="50" y="50" width="150" height="100" rx="10" fill="#cfe2ff" stroke="#0d6efd"/>
  <text x="125" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#084298" text-anchor="middle">Browser (Next.js)</text>
  
  <!-- Arrow Client to API -->
  <line x1="200" y1="100" x2="300" y2="100" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- API Layer -->
  <rect x="300" y="50" width="200" height="100" rx="10" fill="#d1e7dd" stroke="#198754"/>
  <text x="400" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f5132" text-anchor="middle">Next.js API Routes</text>

  <!-- Arrow API to ORM -->
  <line x1="400" y1="150" x2="400" y2="250" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ORM Layer -->
  <rect x="325" y="250" width="150" height="80" rx="10" fill="#fff3cd" stroke="#ffc107"/>
  <text x="400" y="295" font-family="sans-serif" font-size="16" font-weight="bold" fill="#664d03" text-anchor="middle">Prisma ORM</text>

  <!-- Arrow ORM to DB -->
  <line x1="400" y1="330" x2="400" y2="400" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- DB Layer -->
  <rect x="325" y="400" width="150" height="80" rx="40" fill="#f8d7da" stroke="#dc3545"/>
  <text x="400" y="445" font-family="sans-serif" font-size="16" font-weight="bold" fill="#842029" text-anchor="middle">SQLite / Postgres</text>

  <!-- External Services -->
  <rect x="600" y="50" width="150" height="100" rx="10" fill="#e2e3e5" stroke="#6c757d" stroke-dasharray="5,5"/>
  <text x="675" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#383d41" text-anchor="middle">External (Razorpay)</text>
  
  <!-- Arrow API to External -->
  <line x1="500" y1="100" x2="600" y2="100" stroke="#6c757d" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d" />
    </marker>
  </defs>
</svg>
