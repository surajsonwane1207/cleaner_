<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f3f4f6"/>
  
  <!-- Browser Chrome -->
  <rect x="0" y="0" width="800" height="40" fill="#e5e7eb"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5" fill="#27c93f"/>
  <rect x="100" y="10" width="600" height="20" rx="10" fill="white"/>
  <text x="120" y="25" font-family="sans-serif" font-size="12" fill="#9ca3af">localhost:3000/support</text>

  <!-- Navbar -->
  <rect x="0" y="40" width="800" height="60" fill="white" stroke="#e5e7eb"/>
  <text x="40" y="78" font-family="sans-serif" font-size="20" font-weight="bold" fill="#4f46e5">BharatClean</text>
  <text x="500" y="75" font-family="sans-serif" font-size="14" fill="#4b5563">Services</text>
  <text x="580" y="75" font-family="sans-serif" font-size="14" fill="#4b5563">Pricing</text>
  <rect x="660" y="55" width="100" height="30" rx="5" fill="#4f46e5"/>
  <text x="685" y="75" font-family="sans-serif" font-size="14" fill="white">Login</text>

  <!-- Support Form Card -->
  <rect x="200" y="140" width="400" height="420" rx="10" fill="white" stroke="#e5e7eb" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.1))"/>
  <text x="230" y="180" font-family="sans-serif" font-size="24" font-weight="bold" fill="#111827">Contact Support</text>
  
  <!-- Form Fields -->
  <text x="230" y="220" font-family="sans-serif" font-size="14" fill="#374151">Name</text>
  <rect x="230" y="230" width="340" height="30" rx="4" fill="white" stroke="#d1d5db"/>
  
  <text x="230" y="280" font-family="sans-serif" font-size="14" fill="#374151">Email</text>
  <rect x="230" y="290" width="340" height="30" rx="4" fill="white" stroke="#d1d5db"/>
  
  <text x="230" y="340" font-family="sans-serif" font-size="14" fill="#374151">Subject</text>
  <rect x="230" y="350" width="340" height="30" rx="4" fill="white" stroke="#d1d5db"/>
  
  <text x="230" y="400" font-family="sans-serif" font-size="14" fill="#374151">Message</text>
  <rect x="230" y="410" width="340" height="80" rx="4" fill="white" stroke="#d1d5db"/>
  
  <!-- Submit Button -->
  <rect x="230" y="510" width="340" height="35" rx="5" fill="#4f46e5"/>
  <text x="350" y="533" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">Submit Ticket</text>
</svg>
